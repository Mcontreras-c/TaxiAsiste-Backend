name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Los modelos son managed=False (el esquema se arma a mano con los scripts
    # SQL de scripts/, no con migrations) -- por eso los tests corren contra un
    # PostgreSQL real en un contenedor efimero de CI, provisionado con los mismos
    # scripts SQL que el entorno local y el servidor (ver README.md, "Tests").
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: 'False'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taxiasiste_test
      POSTGRES_TEST_DB: taxiasiste_test
      # psql toma la clave de aqui (no hay .env en CI).
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear la base de test
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/setup_test_schema.sql

      # Mismo orden con el que se arma la base en el servidor: esquema base y luego
      # los migrar_* (todos idempotentes). Los scripts sin sufijo _postgres son del
      # Oracle anterior y no se usan.
      - name: Crear el esquema de negocio
        run: |
          for f in \
            create_business_schema_postgres \
            migrar_usuarios_nombre_apellido_postgres \
            migrar_usuarios_telefono_postgres \
            migrar_solicitudes_origen_latlng_postgres \
            migrar_reservas_postgres \
            migrar_fila_inactividad_llamado_postgres; do
            echo "== $f"
            psql -h localhost -U postgres -d taxiasiste_test -v ON_ERROR_STOP=1 -q -f "scripts/$f.sql"
          done

      - name: Migrar tablas de Django (token_blacklist y demas apps managed=True)
        env:
          DJANGO_SETTINGS_MODULE: taxiasiste.settings_test
        run: python manage.py migrate --no-input

      - name: Correr tests
        run: pytest -q
